<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d3b2c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="할리갈리">
<meta name="format-detection" content="telephone=no">
<title>할리갈리</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="board"></div>
  <div id="stage"></div>
  <div id="adds"></div>

  <button id="menuBtn" aria-label="메뉴">⚙</button>

  <div id="over" hidden>
    <button id="again" aria-label="다시 하기"><span>↻</span><small>다시 하기</small></button>
  </div>

  <div id="menu" hidden>
    <div class="panel">
      <h1>할리갈리</h1>
      <p class="rules">
        차례가 오면 내 덱을 터치해 카드를 오픈합니다.<br>
        펼쳐진 맨 위 카드들에서 <b>같은 과일이 정확히 5개</b>가 되면 가장 먼저 내 벨을 누르세요. 펼쳐진 카드를 모두 가져옵니다.<br>
        잘못 누르면 다른 사람에게 카드를 1장씩 줍니다. 카드가 떨어지면 탈락, 마지막까지 남으면 승리!
      </p>
      <button id="muteBtn">소리 켜짐</button>
      <button id="fsBtn">전체 화면</button>
      <button id="newBtn">새 게임</button>
      <button id="closeBtn" class="primary">닫기</button>
    </div>
  </div>

  <div id="probe"></div>

  <script src="js/assets.js"></script>
  <script src="js/game.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
